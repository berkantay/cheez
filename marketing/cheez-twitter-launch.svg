<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Cheez, human-feeling pen marks for React</title>
  <desc id="description">A pure black launch graphic with the handwritten Cheez logo, minimal product copy, an installation command, and colorful examples of hand-drawn marks.</desc>
  <defs>
    <pattern id="grid" width="24" height="36" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V36" fill="none" stroke="#f4f0e6" stroke-opacity="0.055" />
    </pattern>
    <mask id="video-highlight-reveal">
      <rect width="1600" height="900" fill="#000" />
      <path data-video-stroke="highlight" d="M1010 546C1120 526 1280 534 1424 546" fill="none" stroke="#fff" stroke-width="70" stroke-linecap="round" />
    </mask>
  </defs>

  <rect width="1600" height="900" fill="#000" />
  <path d="M816 72V828" stroke="#f4f0e6" stroke-opacity="0.12" />

  <g transform="translate(100 82) scale(2.05)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 11.5C17.5 8.5 10 8.8 7.5 14.5C5 20.2 8.5 25.2 14.5 25C18 24.9 20.2 22.9 21.3 20.8M25.5 5.5C24.4 11.2 24.2 18.8 24.7 25.8M24.5 17.8C27.1 11.8 33.6 9.6 36 13.2C38.6 17.1 34.5 22.4 38.2 24.8M41.2 17.2C45.5 17.1 51.2 15.3 51.1 12.1C51 9.3 46.1 9.3 43 11.5C39.2 14.2 39.6 21.2 43.8 23.9C47.3 26.2 51.9 24 54 21M56.2 17.2C60.5 17.1 66.2 15.3 66.1 12.1C66 9.3 61.1 9.3 58 11.5C54.2 14.2 54.6 21.2 58.8 23.9C62.3 26.2 66.9 24 69 21M72 11.8C77 10.2 84 10 88.2 11.3C84.8 15.1 79.7 20.7 75.4 25C80.5 22.9 86.3 23 91 24.7" stroke="#f4f0e6" stroke-width="3.15" />
    <path d="M98.2 24.3C99.3 23.2 101.1 23.3 101.8 24.5C101.5 26 99.8 26.6 98.5 25.7" stroke="#ff4f2e" stroke-width="3.6" />
  </g>

  <text x="100" y="307" fill="#f4f0e6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="78" font-weight="520" letter-spacing="-4.5">make words feel</text>
  <rect x="94" y="340" width="324" height="100" fill="#ff4f2e" />
  <text x="108" y="416" fill="#000" font-family="Inter, Helvetica, Arial, sans-serif" font-size="89" font-weight="520" letter-spacing="-5.5">human.</text>

  <text x="100" y="520" fill="#f4f0e6" fill-opacity="0.56" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23">sixty hand-drawn marks for react.</text>
  <text x="100" y="560" fill="#f4f0e6" fill-opacity="0.34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="1.5">svg · native waapi · react only</text>

  <g transform="translate(100 645)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="0" y="0" fill="#f4f0e6" font-size="14" letter-spacing="1.5">60 MARKS</text>
    <text x="174" y="0" fill="#8f74ff" font-size="14" letter-spacing="1.5">6 FAMILIES</text>
    <text x="365" y="0" fill="#b7ff3c" font-size="14" letter-spacing="1.5">3 CHARACTERS</text>
  </g>

  <rect x="100" y="716" width="630" height="66" fill="#0b0b0b" />
  <text x="126" y="757" fill="#f4f0e6" fill-opacity="0.34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1">SHADCN</text>
  <text x="222" y="757" fill="#ff4f2e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">npx shadcn@latest add berkantay/cheez/cheez</text>
  <text x="100" y="829" fill="#f4f0e6" fill-opacity="0.34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.1">berkant.me/cheez</text>

  <rect x="854" y="72" width="646" height="756" fill="url(#grid)" />
  <text x="888" y="117" fill="#f4f0e6" fill-opacity="0.32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.5">THE COLLECTION</text>
  <text x="1450" y="117" text-anchor="end" fill="#f4f0e6" fill-opacity="0.42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">60 / 60</text>

  <g font-family="Inter, Helvetica, Arial, sans-serif" font-weight="500" letter-spacing="-2">
    <text x="1038" y="245" fill="#f4f0e6" font-size="48">important</text>
    <path data-video-stroke="underline" d="M1028 269C1115 260 1240 274 1392 264" fill="none" stroke="#ff4f2e" stroke-width="7" stroke-linecap="round" />

    <text x="1065" y="395" fill="#f4f0e6" font-size="48">approved</text>
    <path data-video-stroke="circle" d="M1033 368C1049 328 1394 326 1427 369C1453 407 1355 426 1202 421C1072 418 1009 400 1033 368Z" fill="none" stroke="#8f74ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <path data-video-fill="highlight" d="M1018 512C1118 490 1294 498 1421 516L1411 572C1288 583 1122 576 1012 564Z" fill="#b7ff3c" fill-opacity="0.76" mask="url(#video-highlight-reveal)" />
    <text x="1065" y="554" fill="#f4f0e6" font-size="48">remember</text>

    <text x="1040" y="706" fill="#f4f0e6" font-size="48">look here</text>
    <path data-video-stroke="arrow-line" d="M1012 733C1105 706 1261 708 1390 731" fill="none" stroke="#35d9ff" stroke-width="6" stroke-linecap="round" />
    <path data-video-stroke="arrow-head" d="M1365 712L1394 732L1360 745" fill="none" stroke="#35d9ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <circle cx="1472" cy="802" r="5" fill="#ff5fa2" />
  <circle cx="1452" cy="802" r="5" fill="#35d9ff" />
  <circle cx="1432" cy="802" r="5" fill="#b7ff3c" />
  <circle cx="1412" cy="802" r="5" fill="#8f74ff" />
</svg>
