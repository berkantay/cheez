<svg viewBox="0 0 1200 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Three Cheez drawing characters</title>
  <desc id="description">Calm, rushed, and chaotic versions of a hand-drawn underline.</desc>
  <defs>
    <pattern id="grid" width="20" height="30" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V30" fill="none" stroke="#f4f0e6" stroke-opacity="0.055" />
    </pattern>
    <style>
      .label { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; }
      .word { font: 500 32px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: -.04em; }
      .draw { stroke-dasharray: 100; stroke-linecap: round; stroke-linejoin: round; }
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .draw { display: none; }
        .still { display: block; }
      }
    </style>
  </defs>

  <rect width="1200" height="330" rx="18" fill="#0d0d0c" />
  <rect x="36" y="36" width="1128" height="204" fill="url(#grid)" />
  <path d="M412 36V240M788 36V240" stroke="#f4f0e6" stroke-opacity="0.12" />

  <g>
    <text x="70" y="73" fill="#f4f0e6" fill-opacity="0.34" class="label">01 · calm</text>
    <text x="150" y="153" fill="#f4f0e6" class="word">important</text>
    <path class="draw" d="M145 174C200 170 270 177 333 171" fill="none" stroke="#ff4f2e" stroke-width="5" pathLength="100">
      <animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;.2;.84;1" dur="4.8s" repeatCount="indefinite" />
    </path>
    <path class="still" d="M145 174C200 170 270 177 333 171" fill="none" stroke="#ff4f2e" stroke-width="5" stroke-linecap="round" />
  </g>

  <g>
    <text x="446" y="73" fill="#f4f0e6" fill-opacity="0.34" class="label">02 · rushed</text>
    <text x="526" y="153" fill="#f4f0e6" class="word">important</text>
    <path class="draw" d="M520 175C558 164 615 184 704 169" fill="none" stroke="#8f74ff" stroke-width="6" pathLength="100">
      <animate attributeName="stroke-dashoffset" values="100;100;0;0;100" keyTimes="0;.12;.28;.84;1" dur="4.8s" repeatCount="indefinite" />
    </path>
    <path class="still" d="M520 175C558 164 615 184 704 169" fill="none" stroke="#8f74ff" stroke-width="6" stroke-linecap="round" />
  </g>

  <g>
    <text x="822" y="73" fill="#f4f0e6" fill-opacity="0.34" class="label">03 · chaotic</text>
    <text x="900" y="153" fill="#f4f0e6" class="word">important</text>
    <path class="draw" d="M895 174C930 157 989 190 1086 164" fill="none" stroke="#b7ff3c" stroke-width="6" pathLength="100">
      <animate attributeName="stroke-dashoffset" values="100;100;0;0;100" keyTimes="0;.26;.42;.84;1" dur="4.8s" repeatCount="indefinite" />
    </path>
    <path class="draw" d="M902 184C952 166 1007 194 1076 175" fill="none" stroke="#b7ff3c" stroke-opacity="0.48" stroke-width="3" pathLength="100">
      <animate attributeName="stroke-dashoffset" values="100;100;0;0;100" keyTimes="0;.35;.5;.84;1" dur="4.8s" repeatCount="indefinite" />
    </path>
    <g class="still" fill="none" stroke="#b7ff3c" stroke-linecap="round">
      <path d="M895 174C930 157 989 190 1086 164" stroke-width="6" />
      <path d="M902 184C952 166 1007 194 1076 175" stroke-width="3" stroke-opacity="0.48" />
    </g>
  </g>

  <g transform="translate(54 276)" class="label">
    <text x="0" y="0" fill="#f4f0e6">60 marks</text>
    <text x="253" y="0" fill="#8f74ff">6 families</text>
    <text x="510" y="0" fill="#b7ff3c">3 characters</text>
    <text x="805" y="0" fill="#35d9ff">0 motion dependencies</text>
  </g>
</svg>
